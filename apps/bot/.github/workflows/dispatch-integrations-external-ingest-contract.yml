name: Dispatch Integrations External-Ingest Contract

on:
  push:
    branches: [main]
    paths:
      - "protocol/external-ingest/**"
      - "protocol/schemas/v2/external-ingest-request.schema.json"
      - ".github/workflows/dispatch-integrations-external-ingest-contract.yml"
  workflow_dispatch:
    inputs:
      bot_sha:
        description: "bicameral-bot commit SHA to validate"
        required: false

permissions:
  contents: read

jobs:
  dispatch:
    name: dispatch-integrations-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dispatch bicameral-integrations conformance workflow
        env:
          GH_TOKEN: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN }}
          BOT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.bot_sha || github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::BICAMERAL_CROSS_REPO_TOKEN is required; refusing to leave Integrations silently pinned to an old contract."
            exit 1
          fi
          contract_sha256="$(awk '{print $1}' protocol/external-ingest/contract.sha256)"
          request_schema_sha256="$(sha256sum protocol/schemas/v2/external-ingest-request.schema.json | awk '{print $1}')"
          gh api repos/BicameralAI/bicameral-integrations/dispatches \
            --method POST \
            -f event_type=external_ingest_contract_released \
            -F client_payload[bot_sha]="${BOT_SHA}" \
            -F client_payload[contract_sha256]="${contract_sha256}" \
            -F client_payload[request_schema_sha256]="${request_schema_sha256}" \
            -F client_payload[source_repository]="${GITHUB_REPOSITORY}" \
            -F client_payload[source_run_url]="${SOURCE_RUN_URL}"
