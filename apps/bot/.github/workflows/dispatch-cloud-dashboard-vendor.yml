name: Dispatch Cloud Dashboard Vendor

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "protocol/hosted-bridge/**"
      - ".github/workflows/dispatch-cloud-dashboard-vendor.yml"
  workflow_dispatch:
    inputs:
      bot_sha:
        description: "bicameral-bot commit SHA vendor"
        required: false

permissions:
  contents: read

env:
  R2_BUCKET: ${{ vars.R2_BUCKET || 'bicameral-install' }}
  BICAMERAL_DOWNLOAD_BASE_URL: ${{ vars.BICAMERAL_DOWNLOAD_BASE_URL || 'https://pub-7eab94b264754bee8019fd89ca9b5b0b.r2.dev/bicameral' }}

jobs:
  dispatch:
    name: dispatch-cloud-vendor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.bot_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build and publish immutable dashboard artifact
        id: dashboard
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BOT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.bot_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID}" && test -n "${AWS_SECRET_ACCESS_KEY}" && test -n "${R2_ENDPOINT_URL}"
          cargo build --release --locked --bin bicameral
          (cd dashboard && npm ci --silent && npm run build)
          mkdir -p release-dashboard
          RELEASE_SOURCE_COMMIT="${BOT_SHA}" python3 scripts/emit_release_descriptor.py \
            --verify-hosted-bundle
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf release-dashboard/bicameral-dashboard.tar.gz \
            dashboard/dist protocol/hosted-bridge \
            release-dashboard/bot-release-descriptor.json
          digest="$(sha256sum release-dashboard/bicameral-dashboard.tar.gz | awk '{print $1}')"
          descriptor_digest="$(python3 -c 'import json; print(json.load(open("release-dashboard/bot-release-descriptor.json"))["descriptor_digest"])')"
          object="s3://${R2_BUCKET}/bicameral/dashboard/${BOT_SHA}/bicameral-dashboard.tar.gz"
          aws s3 cp --endpoint-url "${R2_ENDPOINT_URL}" --cache-control "public,max-age=31536000,immutable" release-dashboard/bicameral-dashboard.tar.gz "${object}"
          echo "url=${BICAMERAL_DOWNLOAD_BASE_URL%/}/dashboard/${BOT_SHA}/bicameral-dashboard.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"
          echo "descriptor_digest=${descriptor_digest}" >> "$GITHUB_OUTPUT"

      - name: Retain release descriptor
        uses: actions/upload-artifact@v4
        with:
          name: bot-release-descriptor-${{ github.sha }}
          path: release-dashboard/bot-release-descriptor.json
          retention-days: 90

      - name: Dispatch bicameral-cloud vendor workflow
        env:
          GH_TOKEN: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN || secrets.BICAMERAL_CLOUD_DISPATCH_TOKEN }}
          BOT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.bot_sha || github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DASHBOARD_BUNDLE_URL: ${{ steps.dashboard.outputs.url }}
          DASHBOARD_BUNDLE_SHA256: ${{ steps.dashboard.outputs.sha256 }}
          BOT_DESCRIPTOR_DIGEST: ${{ steps.dashboard.outputs.descriptor_digest }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::BICAMERAL_CROSS_REPO_TOKEN or BICAMERAL_CLOUD_DISPATCH_TOKEN is required; refusing to leave Cloud unpinned."
            exit 1
          fi

          contract_sha256="$(awk '{print $1}' protocol/hosted-bridge/contract.sha256)"

          gh api repos/BicameralAI/bicameral-cloud/dispatches \
            --method POST \
            -f event_type=dashboard_bundle_released \
            -F client_payload[bot_sha]="${BOT_SHA}" \
            -F client_payload[dashboard_bundle_url]="${DASHBOARD_BUNDLE_URL}" \
            -F client_payload[dashboard_bundle_sha256]="${DASHBOARD_BUNDLE_SHA256}" \
            -F client_payload[bot_descriptor_digest]="${BOT_DESCRIPTOR_DIGEST}" \
            -F client_payload[hosted_bridge_contract_sha256]="${contract_sha256}" \
            -F client_payload[source_repository]="${GITHUB_REPOSITORY}" \
            -F client_payload[source_run_url]="${SOURCE_RUN_URL}"
