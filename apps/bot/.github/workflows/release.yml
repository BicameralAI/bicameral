name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish"
        required: true
        type: string
      release_binding_url:
        description: "Immutable HTTPS URL for the exact release publication binding"
        required: true
        type: string
      release_binding_sha256:
        description: "SHA-256 of the exact release publication binding bytes"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  R2_BUCKET: ${{ vars.R2_BUCKET || 'bicameral-install' }}
  BICAMERAL_DOWNLOAD_BASE_URL: ${{ vars.BICAMERAL_DOWNLOAD_BASE_URL || 'https://pub-7eab94b264754bee8019fd89ca9b5b0b.r2.dev/bicameral' }}

jobs:
  release-binding:
    name: Verify exact release publication binding
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Read exact Bot identity
        id: bot
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download and verify immutable binding
        shell: bash
        env:
          RELEASE_BINDING_URL: ${{ inputs.release_binding_url }}
          RELEASE_BINDING_SHA256: ${{ inputs.release_binding_sha256 }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_BINDING_URL}" == https://* ]]
          [[ "${RELEASE_BINDING_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p release-inputs
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --silent \
            --show-error \
            "${RELEASE_BINDING_URL}" \
            --output release-inputs/publication-binding.json
          printf '%s  %s\n' \
            "${RELEASE_BINDING_SHA256}" \
            release-inputs/publication-binding.json \
            | sha256sum --check -
          python3 scripts/generate_public_release_manifest.py \
            --binding release-inputs/publication-binding.json \
            --tag "${RELEASE_TAG}" \
            --bot-commit "${{ steps.bot.outputs.commit }}" \
            --bot-version "${{ steps.bot.outputs.version }}" \
            --validate-only
          test "$(git cat-file -t "${RELEASE_TAG}")" = "tag"
          tag_message="$(git for-each-ref \
            --format='%(contents)' \
            "refs/tags/${RELEASE_TAG}")"
          test "$(printf '%s\n' "${tag_message}" \
            | grep -Fxc "release-binding-url: ${RELEASE_BINDING_URL}")" = "1"
          test "$(printf '%s\n' "${tag_message}" \
            | grep -Fxc "release-binding-sha256: ${RELEASE_BINDING_SHA256}")" = "1"

      - name: Retain exact binding for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publication-binding
          path: release-inputs/publication-binding.json
          if-no-files-found: error
          retention-days: 30

  production-cloud-conformance:
    name: Verify production Cloud contract
    needs: release-binding
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify production Cloud contract
        uses: ./.github/actions/verify-production-cloud-contract

  build:
    needs: production-cloud-conformance
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Unix release binary
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build Windows release binary with static CRT
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          $binary = 'target/x86_64-pc-windows-msvc/release/bicameral.exe'
          if (-not (Test-Path $binary)) { throw 'Windows release build did not produce bicameral.exe' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found on the Windows release runner' }
          $dependencies = (& $dumpbin /DEPENDENTS $binary) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin dependency inspection failed' }
          if ($dependencies -match '(?i)VCRUNTIME140(?:_1)?\.dll|MSVCP140\.dll') {
            throw 'Windows release binary still depends on the VC++ redistributable runtime'
          }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows release binary did not execute --version' }

      - name: Package Unix archive
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/${{ matrix.target }}/release/bicameral staging/bicameral
          cd staging
          tar czf ../bicameral-${{ matrix.target }}.tar.gz bicameral

      - name: Package Windows archive
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bicameral.exe" "staging/bicameral.exe"
          Push-Location staging
          tar -czf "../bicameral-${{ matrix.target }}.tar.gz" bicameral.exe
          Pop-Location
          if (-not (Test-Path "bicameral-${{ matrix.target }}.tar.gz")) { throw 'Windows release archive was not created' }

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bicameral-${{ matrix.target }}
          path: bicameral-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs:
      - build
      - release-binding
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect archives and generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/*/bicameral-*.tar.gz release/
          expected_assets=5
          actual_assets="$(find release -name 'bicameral-*.tar.gz' | wc -l | tr -d ' ')"
          test "$actual_assets" = "$expected_assets"
          cd release
          sha256sum bicameral-*.tar.gz > SHA256SUMS

      - name: Generate public release manifest
        env:
          DOWNLOAD_BASE_URL: ${{ env.BICAMERAL_DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${version}"
          cp \
            artifacts/release-publication-binding/publication-binding.json \
            release/publication-binding.json
          python3 scripts/generate_public_release_manifest.py \
            --binding release/publication-binding.json \
            --release-dir release \
            --tag "${RELEASE_TAG}" \
            --bot-commit "$(git rev-parse HEAD)" \
            --bot-version "${version}" \
            --download-base-url "${DOWNLOAD_BASE_URL}" \
            --output release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/bicameral-aarch64-apple-darwin.tar.gz
            release/bicameral-x86_64-apple-darwin.tar.gz
            release/bicameral-x86_64-unknown-linux-gnu.tar.gz
            release/bicameral-aarch64-unknown-linux-gnu.tar.gz
            release/bicameral-x86_64-pc-windows-msvc.tar.gz
            release/SHA256SUMS
            release/latest.json
            release/publication-binding.json
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish public release artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          version_prefix="s3://${R2_BUCKET}/bicameral/${RELEASE_TAG}"
          latest_manifest="s3://${R2_BUCKET}/bicameral/latest.json"

          for archive in release/bicameral-*.tar.gz; do
            aws s3 cp \
              --endpoint-url "${R2_ENDPOINT_URL}" \
              --cache-control "public,max-age=31536000,immutable" \
              "${archive}" \
              "${version_prefix}/$(basename "${archive}")"
          done

          aws s3 cp \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --cache-control "public,max-age=31536000,immutable" \
            release/SHA256SUMS \
            "${version_prefix}/SHA256SUMS"

          aws s3 cp \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --cache-control "public,max-age=31536000,immutable" \
            release/publication-binding.json \
            "${version_prefix}/publication-binding.json"

          aws s3 cp \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --cache-control "public,max-age=60" \
            release/latest.json \
            "${latest_manifest}"
