name: Release provenance

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-release-descriptor:
    name: bot-release-descriptor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build exact release artifacts
        run: |
          cargo build --release --locked --bin bicameral
          npm ci --prefix dashboard
          npm run build --prefix dashboard
      - name: Emit and verify immutable descriptor
        run: |
          python3 -m unittest scripts.tests.test_emit_release_descriptor
          python3 scripts/emit_release_descriptor.py --verify-hosted-bundle
          python3 scripts/emit_release_descriptor.py \
            --verify release-dashboard/bot-release-descriptor.json \
            --verify-hosted-bundle
      - name: Retain release descriptor
        uses: actions/upload-artifact@v4
        with:
          name: bot-release-descriptor-${{ github.sha }}
          path: release-dashboard/bot-release-descriptor.json
          if-no-files-found: error
          retention-days: 90
