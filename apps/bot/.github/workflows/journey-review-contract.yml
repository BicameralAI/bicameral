name: Journey Review Contract

# Soft-disabled as a PR gate (Phase 1 collapse).
# Tests remain covered by rust.yml `cargo test --workspace` (required check: rust-workspace).
# Branch protection does not require this workflow name.
# Kept as workflow_dispatch for manual archaeology / re-run during a transition window.
# Job steps preserved; former path filters lived under on.pull_request (see git history).


on:
  workflow_dispatch:

permissions:
  contents: read

# Read-only composition: this lane must not append canonical events, create
# projection work, invoke a model provider, or rewrite daemon-local candidates.
# The endpoint journey must use the real event, evidence, and SQLite repositories.
jobs:
  journey-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile affected crates
        run: |
          set -o pipefail
          mkdir -p test-artifacts/journey-review
          cargo check -p bicameral-api -p bicameral-gateway -p bicameral-runtime --locked \
            2>&1 | tee test-artifacts/journey-review/check.log
      - name: Run journey review unit contract
        run: |
          set -o pipefail
          cargo test -p bicameral-gateway journey_review --lib --locked -- --nocapture \
            2>&1 | tee test-artifacts/journey-review/unit.log
      - name: Run journey review endpoint journey
        run: |
          set -o pipefail
          cargo test -p bicameral-gateway --test journey_review_read_model --locked -- --nocapture \
            2>&1 | tee test-artifacts/journey-review/endpoint.log
      - name: Lint affected production libraries
        run: |
          set -o pipefail
          cargo clippy -p bicameral-api -p bicameral-gateway -p bicameral-runtime --lib --locked -- -D warnings \
            2>&1 | tee test-artifacts/journey-review/clippy.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-review-diagnostics
          path: |
            test-artifacts/journey-review/
            crates/bicameral-gateway/src/journey_review.rs
          if-no-files-found: ignore
          retention-days: 14
