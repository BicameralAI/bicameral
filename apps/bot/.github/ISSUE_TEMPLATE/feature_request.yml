name: Feature request
description: Propose a new capability for the daemon, gateway, protocol, or runtime.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What governance, grounding, or integration gap should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior and which surface it touches.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Authority boundaries
      description: How does this preserve the boundary — edges propose, the daemon decides what becomes canonical (ADR-0007)? How does it stay reviewable and replayable?
    validations:
      required: true
