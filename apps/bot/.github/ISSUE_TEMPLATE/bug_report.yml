name: Bug report
description: Report daemon, gateway, protocol, runtime, or documentation behavior that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, the affected crate/surface (daemon, gateway, protocol, runtime, event-store), and any relevant command output.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, release, or commit SHA where you observed this.
    validations:
      required: false
