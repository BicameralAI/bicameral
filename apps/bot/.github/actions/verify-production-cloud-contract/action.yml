name: Verify production Cloud byte-bound contract
description: Reconstruct the exact Bot producer artifact locally, then require production Cloud to serve matching byte-bound identity.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.23.2
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.97.1
      with:
        toolchain: 1.97.1

    - name: Reconstruct immutable Bot dashboard artifact
      shell: bash
      run: |
        set -euo pipefail
        bot_sha="$(git rev-parse HEAD)"
        cargo build --release --locked --bin bicameral
        (cd dashboard && npm ci --silent && npm run build)
        mkdir -p release-dashboard
        RELEASE_SOURCE_COMMIT="${bot_sha}" python3 scripts/emit_release_descriptor.py \
          --verify-hosted-bundle
        tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
          -czf release-dashboard/bicameral-dashboard.tar.gz \
          dashboard/dist protocol/hosted-bridge \
          release-dashboard/bot-release-descriptor.json

    - name: Verify production Cloud against reconstructed artifact
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/verify_production_cloud_contract.py \
          --expected-bot-commit "$(git rev-parse HEAD)" \
          --immutable-bot-artifact release-dashboard/bicameral-dashboard.tar.gz
