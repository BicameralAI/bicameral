[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "bicameral-cloud"
version = "0.1.0"
description = "Hosted optimization and coordination layer for Bicameral"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "jsonschema>=4.23,<5",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
]
# Browser UserJourney harness (issue #114): the deterministic hosted-project-
# creation journey drives a real browser via Playwright. Kept separate so the
# core unit/conformance suite needs no browser toolchain.
journey = [
    # Pin browser protocol + executable revision so release evidence cannot
    # silently drift when a newer Playwright package is published.
    "playwright==1.59.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "conformance: cross-repo Cloud↔daemon pairing conformance harness",
    "journey: deterministic browser UserJourney harness (requires Playwright)",
]
