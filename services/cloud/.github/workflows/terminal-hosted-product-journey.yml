name: Terminal Hosted Product Journey

# Real-process Product Create/Join release gate. Run only when the Product
# topology or its evidence contract changes. Deployment/provider workflow-only
# changes are validated by their dedicated gates and must not inherit this
# unrelated Product journey merely because deploy-cloud-run.yml changed.
on:
  workflow_call:
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/terminal-hosted-product-journey.yml"
      - "pyproject.toml"
      - "scripts/run_real_process_hosted_topology.py"
      - "tests/test_real_process_hosted_topology.py"
      - "src/bicameral_cloud/static/dashboard/**"
      - "src/bicameral_cloud/contracts/**"
      - "scripts/emit_release_descriptor.py"
      - "scripts/release_manifest_delivery.py"
      - "tests/test_release_manifest_delivery.py"
      - "release-inputs/**"

permissions:
  contents: read

env:
  MCP_REF: bb47e9749325f55415f79b7389015186216c4b86
  FACTORY_COMMIT: 8ea192c21bf78837ddf0d841d423b18328871444

jobs:
  terminal-hosted-product-journey:
    name: terminal-hosted-product-journey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Cloud
        uses: actions/checkout@v4

      - name: Resolve exact Bot commit from the served SPA
        id: release
        run: |
          bot_ref="$(python -c 'import json; print(json.load(open("src/bicameral_cloud/static/dashboard/version.json"))["bot_commit"])')"
          [[ "${bot_ref}" =~ ^[a-f0-9]{40}$ ]]
          echo "bot_ref=${bot_ref}" >> "$GITHUB_OUTPUT"

      - name: Check out exact bot repair
        uses: actions/checkout@v4
        with:
          repository: BicameralAI/bicameral-bot
          ref: ${{ steps.release.outputs.bot_ref }}
          path: _topology/bicameral-bot
          token: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN || secrets.BICAMERAL_BOT_READ_TOKEN }}
          persist-credentials: false

      - name: Check out exact MCP conformance revision
        uses: actions/checkout@v4
        with:
          repository: BicameralAI/bicameral-mcp
          ref: ${{ env.MCP_REF }}
          path: _topology/bicameral-mcp
          token: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN || secrets.BICAMERAL_BOT_READ_TOKEN }}
          persist-credentials: false

      - name: Check out exact release policy
        uses: actions/checkout@v4
        with:
          repository: BicameralAI/bicameral-factory
          ref: ${{ env.FACTORY_COMMIT }}
          path: _release/factory
          token: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN || secrets.BICAMERAL_BOT_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Product journey applicability contract
        run: python -m unittest tests.test_terminal_hosted_product_journey_workflow -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install pinned browser runtime
        run: |
          python -m pip install -e '.[journey]'
          python -m playwright install --with-deps chromium

      - name: Assemble exact immutable release manifest
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/terminal-hosted-product-journey
          # This step materializes manifest inputs only. The next real-process
          # topology step independently verifies the vendored dashboard against
          # the exact checked-out Bot build; producer-authentic deploy proof is
          # separately enforced in the trusted dev/main deploy workflow.
          python scripts/emit_release_descriptor.py \
            --validation-only \
            --output test-artifacts/terminal-hosted-product-journey/cloud-release-descriptor.json
          python scripts/release_manifest_delivery.py manifest \
            --bot-descriptor release-inputs/bot-release-descriptor.json \
            --cloud-descriptor test-artifacts/terminal-hosted-product-journey/cloud-release-descriptor.json \
            --output test-artifacts/terminal-hosted-product-journey/release-manifest.json

      - name: Run exact hosted Create and Join journey
        run: |
          python scripts/run_real_process_hosted_topology.py \
            --bot-repo _topology/bicameral-bot \
            --mcp-repo _topology/bicameral-mcp \
            --factory-commit "${FACTORY_COMMIT}" \
            --receipt test-artifacts/terminal-hosted-product-journey/raw-topology-receipt.json \
            --use-vendored-dashboard \
            --terminal-user-journey

      - name: Bind and validate terminal journey evidence
        run: |
          set -euo pipefail
          python scripts/release_manifest_delivery.py receipt \
            --manifest test-artifacts/terminal-hosted-product-journey/release-manifest.json \
            --raw-receipt test-artifacts/terminal-hosted-product-journey/raw-topology-receipt.json \
            --output test-artifacts/terminal-hosted-product-journey/journey-receipt.json
          python _release/factory/scripts/release_manifest.py \
            test-artifacts/terminal-hosted-product-journey/release-manifest.json \
            --descriptor bot=release-inputs/bot-release-descriptor.json \
            --descriptor cloud=test-artifacts/terminal-hosted-product-journey/cloud-release-descriptor.json \
            --receipt test-artifacts/terminal-hosted-product-journey/journey-receipt.json

      - name: Retain receipt and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-evidence-${{ github.sha }}
          path: test-artifacts/terminal-hosted-product-journey/
          if-no-files-found: error
          retention-days: 14
