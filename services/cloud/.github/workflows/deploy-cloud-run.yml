name: Deploy Cloud Run

# Deployment is an explicit delivery action. Staging merges into `dev` must not
# implicitly deploy; the delivery controller dispatches this workflow on the
# exact `dev` or `main` ref with the exact staged Bot commit selected for the
# release tuple.
on:
  workflow_dispatch:
    inputs:
      bot_sha:
        description: "Exact staged Bot commit selected by the release tuple"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The Bot release binary embeds its absolute build path, so reconstructing
  # the Bot producer artifact under a different directory than the one the
  # Bot's own producers build in yields different daemon bytes for the very
  # same commit. Reconstruct where the Bot builds itself, which is the
  # GITHUB_WORKSPACE of the bicameral-bot repository.
  BOT_CANONICAL_SOURCE_PATH: /home/runner/work/bicameral-bot/bicameral-bot

jobs:
  deploy:
    name: deploy
    # Production is explicit on main. Staging is explicit on dev and remains
    # disabled until the staging substrate is provisioned (ADR-0008).
    if: ${{ github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/dev' && vars.STAGING_ENABLED == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out exact release policy
        uses: actions/checkout@v4
        with:
          repository: BicameralAI/bicameral-factory
          # Byte-bound served-identity contract: each served component must
          # expose artifacts, commit, descriptor_digest and interfaces, and all
          # four must match the immutable release manifest. Pin the immutable
          # Factory merge commit that actually contains it, never a PR head.
          ref: 4b74e4dce208338e12629f37dea7dd48954b9ee0
          path: _release/factory
          token: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN || secrets.BICAMERAL_BOT_READ_TOKEN }}
          persist-credentials: false

      - name: Resolve exact selected Bot commit
        id: bot_source
        run: |
          set -euo pipefail
          bot_sha="${{ inputs.bot_sha }}"
          [[ "${bot_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${bot_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact private Bot source
        uses: actions/checkout@v4
        with:
          repository: BicameralAI/bicameral-bot
          ref: ${{ steps.bot_source.outputs.sha }}
          path: _release/bot
          token: ${{ secrets.BICAMERAL_CROSS_REPO_TOKEN || secrets.BICAMERAL_BOT_READ_TOKEN }}
          persist-credentials: false

      - name: Place Bot source at its canonical build path
        env:
          BOT_SHA: ${{ steps.bot_source.outputs.sha }}
        run: |
          set -euo pipefail
          # bicameral-bot#1172: a controlled four-cell matrix on one runner VM
          # (bicameral-bot run 32998525832, Rust 1.97.1, image 20260816.277.1)
          # proved the absolute source path is the SOLE causal variable in the
          # daemon bytes. Same path rebuilt twice was byte-identical; shallow
          # versus full checkout was byte-identical; only moving the path
          # changed the binary. Building under _release/bot therefore produced
          # a daemon digest that no Bot-side producer can ever reproduce.
          test -n "${BOT_CANONICAL_SOURCE_PATH}"
          [[ "${BOT_CANONICAL_SOURCE_PATH}" == /home/runner/work/* ]]
          rm -rf "${BOT_CANONICAL_SOURCE_PATH}"
          mkdir -p "${BOT_CANONICAL_SOURCE_PATH}"
          # Copy rather than move so the checkout action's own post-step still
          # finds the path it created.
          cp -a _release/bot/. "${BOT_CANONICAL_SOURCE_PATH}/"
          actual_sha="$(git -C "${BOT_CANONICAL_SOURCE_PATH}" rev-parse HEAD)"
          test "${actual_sha}" = "${BOT_SHA}"

      - name: Set up Node.js for Bot reconstruction and migration runner
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2

      - name: Set up Rust for exact Bot reconstruction
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1.97.1
        with:
          toolchain: 1.97.1

      - name: Reconstruct immutable Bot producer artifact
        env:
          BOT_SHA: ${{ steps.bot_source.outputs.sha }}
        run: |
          set -euo pipefail
          pushd "${BOT_CANONICAL_SOURCE_PATH}" >/dev/null
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${BOT_SHA}"
          cargo build --release --locked --bin bicameral
          (cd dashboard && npm ci --silent && npm run build)
          mkdir -p release-dashboard
          RELEASE_SOURCE_COMMIT="${BOT_SHA}" python3 scripts/emit_release_descriptor.py \
            --verify-hosted-bundle
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf release-dashboard/bicameral-dashboard.tar.gz \
            dashboard/dist protocol/hosted-bridge \
            release-dashboard/bot-release-descriptor.json
          popd >/dev/null

      - name: Materialize exact staged Bot dashboard into Cloud
        env:
          BOT_SHA: ${{ steps.bot_source.outputs.sha }}
        run: |
          set -euo pipefail
          artifact="${BOT_CANONICAL_SOURCE_PATH}/release-dashboard/bicameral-dashboard.tar.gz"
          descriptor="${BOT_CANONICAL_SOURCE_PATH}/release-dashboard/bot-release-descriptor.json"
          artifact_sha="$(sha256sum "${artifact}" | awk '{print $1}')"
          descriptor_digest="$(DESCRIPTOR="${descriptor}" python3 -c 'import json, os; print(json.load(open(os.environ["DESCRIPTOR"]))["descriptor_digest"])')"
          [[ "${artifact_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${descriptor_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -s "${descriptor}"

          DASHBOARD_BOT_SHA="${BOT_SHA}" \
          DASHBOARD_SOURCE_REPOSITORY="BicameralAI/bicameral-bot" \
          DASHBOARD_SOURCE_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          DASHBOARD_ARTIFACT_SHA256="${artifact_sha}" \
          BOT_DESCRIPTOR_DIGEST="${descriptor_digest}" \
          DASHBOARD_ALREADY_BUILT=1 \
            scripts/vendor_dashboard.sh "${BOT_CANONICAL_SOURCE_PATH}/dashboard"

          materialized_bot_sha="$(python3 -c 'import json; print(json.load(open("src/bicameral_cloud/static/dashboard/version.json"))["bot_commit"])')"
          test "${materialized_bot_sha}" = "${BOT_SHA}"

      - name: Materialize exact release manifest and served identity
        run: |
          set -euo pipefail
          mkdir -p release-cloud
          python3 scripts/emit_release_descriptor.py \
            --immutable-bot-artifact "${BOT_CANONICAL_SOURCE_PATH}/release-dashboard/bicameral-dashboard.tar.gz" \
            --output release-cloud/cloud-release-descriptor.json
          python3 scripts/release_manifest_delivery.py manifest \
            --bot-descriptor release-inputs/bot-release-descriptor.json \
            --cloud-descriptor release-cloud/cloud-release-descriptor.json \
            --output release-cloud/release-manifest.json
          python3 scripts/release_manifest_delivery.py identity \
            --manifest release-cloud/release-manifest.json \
            --output src/bicameral_cloud/static/dashboard/release-identity.json
          python3 scripts/migration_delivery.py compile \
            --migrations-dir supabase/migrations \
            --metadata-dir supabase/migration-metadata \
            --cloud-commit "${GITHUB_SHA}" \
            --output release-cloud/database-migration-set.json
          cp src/bicameral_cloud/static/dashboard/release-identity.json \
            release-cloud/expected-served-identity.json

      - name: Resolve deploy target
        id: target
        run: |
          # Runtime secrets use separate per-environment Secret Manager material.
          # Keep every mount name centralized here so deploy updates cannot silently
          # drop Product Join, product-creation proof, or Google Desktop credentials.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "service=bicameral-cloud" >> "$GITHUB_OUTPUT"
            echo "service_key_secret=supabase-service-key" >> "$GITHUB_OUTPUT"
            echo "product_join_signing_secret=product-join-signing-private-key" >> "$GITHUB_OUTPUT"
            echo "product_creation_proof_secret=product-creation-proof-verification-keys" >> "$GITHUB_OUTPUT"
            echo "google_oauth_client_secret=google-oauth-desktop-client-secret-prod" >> "$GITHUB_OUTPUT"
            echo "product_join_ticket_issuer=https://app.bicameral-ai.com" >> "$GITHUB_OUTPUT"
            echo "product_join_signing_key_id=prod-2026-08" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "service=bicameral-cloud-staging" >> "$GITHUB_OUTPUT"
            echo "service_key_secret=supabase-service-key-staging" >> "$GITHUB_OUTPUT"
            echo "product_join_signing_secret=product-join-signing-private-key-staging" >> "$GITHUB_OUTPUT"
            echo "product_creation_proof_secret=product-creation-proof-verification-keys-staging" >> "$GITHUB_OUTPUT"
            echo "google_oauth_client_secret=google-oauth-desktop-client-secret-staging" >> "$GITHUB_OUTPUT"
            echo "product_join_ticket_issuer=https://staging.bicameral-ai.com" >> "$GITHUB_OUTPUT"
            echo "product_join_signing_key_id=staging-2026-07" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject placeholder deployment configuration
        env:
          # Non-empty is not the same as configured. A provisioning run on
          # 2026-09-18 wrote literal "..." placeholders into the staging
          # secrets and variables, and every downstream "is it set" check
          # accepted them. Reject known placeholders and shape mismatches for
          # the selected environment before GCP auth, migrations, builds, or
          # any Cloud Run mutation. Values are never echoed; only names are.
          ENV_NAME: ${{ steps.target.outputs.env_name }}
          PROD_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROD_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROD_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CLIENT_ID }}
          PROD_GOOGLE_OAUTH_CONFIG_VERSION: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CONFIG_VERSION }}
          STAGING_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
          STAGING_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CLIENT_ID_STAGING }}
          STAGING_GOOGLE_OAUTH_CONFIG_VERSION: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CONFIG_VERSION_STAGING }}
        run: |
          set -euo pipefail
          if [ "$ENV_NAME" = "production" ]; then
            prefix="PROD_"
          else
            prefix="STAGING_"
          fi
          failed=0
          reject() {
            echo "::error::$1 for the ${ENV_NAME} environment $2; refusing to deploy." >&2
            failed=1
          }
          check() {
            local label="$1" shape="$2" name="${prefix}$3"
            local value="${!name:-}"
            local trimmed
            trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"
            case "$trimmed" in
              ""|"..."|"-"|"TODO"|"REPLACE_ME"|"CHANGEME"|"<"*">")
                reject "$label" "is empty or a placeholder"
                return
                ;;
            esac
            case "$shape" in
              https)
                [[ "$trimmed" == https://* ]] || reject "$label" "must be an https:// URL"
                ;;
              postgres)
                [[ "$trimmed" =~ ^postgres(ql)?:// ]] || reject "$label" "must be a postgres:// or postgresql:// URL"
                ;;
              api_key)
                [[ "$trimmed" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ || "$trimmed" == sb_publishable_* ]] ||
                  reject "$label" "is not a Supabase anon/publishable key"
                ;;
              google_client_id)
                [[ "$trimmed" == *.apps.googleusercontent.com ]] || reject "$label" "is not a Google OAuth client ID"
                ;;
            esac
          }
          check "SUPABASE_URL" https SUPABASE_URL
          check "SUPABASE_ANON_KEY" api_key SUPABASE_ANON_KEY
          check "SUPABASE_DB_URL" postgres MIGRATION_DATABASE_URL
          check "BICAMERAL_GOOGLE_OAUTH_CLIENT_ID" google_client_id GOOGLE_OAUTH_CLIENT_ID
          check "BICAMERAL_GOOGLE_OAUTH_CONFIG_VERSION" text GOOGLE_OAUTH_CONFIG_VERSION
          [ "$failed" -eq 0 ] || exit 1
          echo "Deployment configuration for ${ENV_NAME} passed placeholder and shape checks."

      - name: Validate provider OAuth configuration before deployment
        env:
          # Google native OAuth client IDs are public application metadata
          # distributed via repository variables. Validate before authentication,
          # migrations, builds, or Cloud Run mutation so missing configuration
          # fails without creating a revision or touching traffic.
          PROD_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CLIENT_ID }}
          STAGING_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CLIENT_ID_STAGING }}
          ENV_NAME: ${{ steps.target.outputs.env_name }}
        run: |
          set -euo pipefail
          if [ "$ENV_NAME" = "production" ]; then
            GOOGLE_OAUTH_CLIENT_ID="$PROD_GOOGLE_OAUTH_CLIENT_ID"
          else
            GOOGLE_OAUTH_CLIENT_ID="$STAGING_GOOGLE_OAUTH_CLIENT_ID"
          fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            echo "::error::BICAMERAL_GOOGLE_OAUTH_CLIENT_ID must be provisioned for the ${ENV_NAME} environment before deployment; refusing to create a Cloud Run revision." >&2
            exit 1
          fi
          echo "Provider OAuth configuration present for ${ENV_NAME}."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/694608247534/locations/global/workloadIdentityPools/github-actions/providers/bicameral-cloud
          service_account: bicameral-cloud-builder@bicameral-cloud-500911.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture rollback revision
        id: previous
        run: |
          set -euo pipefail
          # Roll back to the revision that is actually SERVING traffic. Using
          # status.latestReadyRevisionName is wrong once traffic has ever been
          # pinned by name: the newest ready revision can hold 0% of traffic,
          # so a "rollback" to it would silently change what production serves.
          previous_revision="$(gcloud run services describe "${{ steps.target.outputs.service }}" \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --format='value(status.traffic[0].revisionName)')"
          if [ -z "${previous_revision}" ]; then
            previous_revision="$(gcloud run services describe "${{ steps.target.outputs.service }}" \
              --project bicameral-cloud-500911 \
              --region us-central1 \
              --format='value(status.latestReadyRevisionName)')"
          fi
          test -n "${previous_revision}"
          echo "Currently serving revision: ${previous_revision}"
          echo "previous_revision=${previous_revision}" >> "${GITHUB_OUTPUT}"

      - name: Apply manifest-bound Supabase migration set
        id: migrate
        shell: bash
        env:
          PROD_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            MIGRATION_DATABASE_URL="$PROD_MIGRATION_DATABASE_URL"
          else
            MIGRATION_DATABASE_URL="$STAGING_MIGRATION_DATABASE_URL"
          fi
          if [ -n "${MIGRATION_DATABASE_URL}" ]; then
            echo "::add-mask::${MIGRATION_DATABASE_URL}"
          fi
          export MIGRATION_DATABASE_URL

          python3 scripts/migration_delivery.py execute \
            --manifest release-cloud/release-manifest.json \
            --migration-set release-cloud/database-migration-set.json \
            --migrations-dir supabase/migrations \
            --metadata-dir supabase/migration-metadata \
            --environment "${{ steps.target.outputs.env_name }}" \
            --database-url-env MIGRATION_DATABASE_URL \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-sha "${GITHUB_SHA}" \
            --output release-cloud/database-migration-execution-receipt.json

      - name: Publish concise migration report
        if: ${{ always() && steps.migrate.outcome != 'skipped' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEV_ENVIRONMENT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          report_file="${RUNNER_TEMP}/supabase-migration-report.json"
          python3 scripts/build_migration_report.py \
            --receipt release-cloud/database-migration-execution-receipt.json \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            > "${report_file}"

          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::warning::Slack migration reporting is not configured." >&2
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-type: application/json" \
            --data-binary "@${report_file}" \
            "${SLACK_WEBHOOK_URL}"

      - name: Upload migration execution receipt
        if: ${{ always() && steps.migrate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: database-migration-execution-${{ github.sha }}
          path: release-cloud/database-migration-execution-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Build and deploy
        id: deploy_release
        continue-on-error: true
        run: |
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --service-account projects/bicameral-cloud-500911/serviceAccounts/bicameral-cloud-builder@bicameral-cloud-500911.iam.gserviceaccount.com \
            --substitutions COMMIT_SHA="$GITHUB_SHA",_SERVICE_NAME="${{ steps.target.outputs.service }}" \
            --quiet

      - name: Configure runtime auth env
        id: configure_release
        if: steps.deploy_release.outcome == 'success'
        continue-on-error: true
        env:
          # Supabase browser values retain their existing secret-backed path.
          PROD_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
          # Google native OAuth client IDs/config versions are public application
          # metadata, so repository variables are the correct distribution surface.
          PROD_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CLIENT_ID }}
          STAGING_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CLIENT_ID_STAGING }}
          PROD_GOOGLE_OAUTH_CONFIG_VERSION: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CONFIG_VERSION }}
          STAGING_GOOGLE_OAUTH_CONFIG_VERSION: ${{ vars.BICAMERAL_GOOGLE_OAUTH_CONFIG_VERSION_STAGING }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            SUPABASE_URL="$PROD_SUPABASE_URL"
            SUPABASE_ANON_KEY="$PROD_SUPABASE_ANON_KEY"
            GOOGLE_OAUTH_CLIENT_ID="$PROD_GOOGLE_OAUTH_CLIENT_ID"
            GOOGLE_OAUTH_CONFIG_VERSION="$PROD_GOOGLE_OAUTH_CONFIG_VERSION"
          else
            SUPABASE_URL="$STAGING_SUPABASE_URL"
            SUPABASE_ANON_KEY="$STAGING_SUPABASE_ANON_KEY"
            GOOGLE_OAUTH_CLIENT_ID="$STAGING_GOOGLE_OAUTH_CLIENT_ID"
            GOOGLE_OAUTH_CONFIG_VERSION="$STAGING_GOOGLE_OAUTH_CONFIG_VERSION"
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY must be set for the ${{ steps.target.outputs.env_name }} environment." >&2
            exit 1
          fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            echo "::error::BICAMERAL_GOOGLE_OAUTH_CLIENT_ID must be provisioned for the ${{ steps.target.outputs.env_name }} environment before deployment." >&2
            exit 1
          fi
          # `--set-secrets` replaces the service's complete secret-backed env
          # list. Keep every runtime secret in this single call so adding OAuth or
          # other deploy wiring cannot strip an existing runtime secret again.
          PRODUCT_JOIN_TICKET_ISSUER="${{ steps.target.outputs.product_join_ticket_issuer }}"
          PRODUCT_JOIN_SIGNING_KEY_ID="${{ steps.target.outputs.product_join_signing_key_id }}"
          gcloud run services update "${{ steps.target.outputs.service }}" \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --update-env-vars "SUPABASE_URL=${SUPABASE_URL},SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY},BICAMERAL_GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID},BICAMERAL_GOOGLE_OAUTH_ENVIRONMENT=${{ steps.target.outputs.env_name }},BICAMERAL_GOOGLE_OAUTH_CONFIG_VERSION=${GOOGLE_OAUTH_CONFIG_VERSION},PRODUCT_JOIN_TICKET_ISSUER=${PRODUCT_JOIN_TICKET_ISSUER},PRODUCT_JOIN_SIGNING_KEY_ID=${PRODUCT_JOIN_SIGNING_KEY_ID},PRODUCT_JOIN_TICKET_TTL_SECONDS=300" \
            --remove-env-vars SUPABASE_SERVICE_KEY,PRODUCT_JOIN_SIGNING_PRIVATE_KEY_B64,PRODUCT_CREATION_PROOF_VERIFICATION_KEYS_JSON,BICAMERAL_GOOGLE_OAUTH_CLIENT_SECRET \
            --set-secrets "SUPABASE_SERVICE_KEY=${{ steps.target.outputs.service_key_secret }}:latest,PRODUCT_JOIN_SIGNING_PRIVATE_KEY_B64=${{ steps.target.outputs.product_join_signing_secret }}:latest,PRODUCT_CREATION_PROOF_VERIFICATION_KEYS_JSON=${{ steps.target.outputs.product_creation_proof_secret }}:latest,BICAMERAL_GOOGLE_OAUTH_CLIENT_SECRET=${{ steps.target.outputs.google_oauth_client_secret }}:latest" \
            --quiet

      - name: Identify candidate revision
        id: candidate
        if: >-
          steps.deploy_release.outcome == 'success' &&
          steps.configure_release.outcome == 'success'
        run: |
          set -euo pipefail
          candidate="$(gcloud run services describe "${{ steps.target.outputs.service }}" \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --format='value(status.latestCreatedRevisionName)')"
          test -n "${candidate}"
          candidate_image="$(gcloud run revisions describe "${candidate}" \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --format='value(spec.containers[0].image)')"
          echo "Candidate revision: ${candidate}"
          echo "Candidate image:    ${candidate_image}"
          echo "candidate=${candidate}" >> "${GITHUB_OUTPUT}"
          echo "candidate_image=${candidate_image}" >> "${GITHUB_OUTPUT}"

      - name: Promote traffic to the candidate revision
        id: promote
        if: steps.candidate.outcome == 'success'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          PREVIOUS_REVISION: ${{ steps.previous.outputs.previous_revision }}
        run: |
          set -euo pipefail
          # `gcloud run deploy` only routes to the new revision while the
          # service traffic block is `latestRevision: true`. The rollback step
          # below pins traffic by revisionName, and Cloud Run never restores
          # the latestRevision form on its own. After the first rolled-back
          # deploy the service is therefore frozen: every later deploy builds
          # and creates a correct new revision that receives 0% of traffic,
          # production keeps serving the stale revision, verification observes
          # the stale identity, and the rollback re-pins the same stale
          # revision. Promotion has to be explicit so the pin is broken on
          # every deploy rather than only on the first one.
          if [ "${CANDIDATE}" = "${PREVIOUS_REVISION}" ]; then
            echo "::error::Deploy produced no new revision (candidate == currently serving ${PREVIOUS_REVISION}); refusing to claim a release." >&2
            exit 1
          fi
          gcloud run services update-traffic "${{ steps.target.outputs.service }}" \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --to-revisions "${CANDIDATE}=100" \
            --quiet
          serving="$(gcloud run services describe "${{ steps.target.outputs.service }}" \
            --project bicameral-cloud-500911 \
            --region us-central1 \
            --format='value(status.traffic[0].revisionName)')"
          test "${serving}" = "${CANDIDATE}"
          echo "Production traffic now routed to ${serving}"

      - name: Resolve served identity target
        id: served_identity_target
        if: >-
          steps.deploy_release.outcome == 'success' &&
          steps.configure_release.outcome == 'success'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            base_url="https://app.bicameral-ai.com"
          else
            base_url="$(gcloud run services describe "${{ steps.target.outputs.service }}" \
              --project bicameral-cloud-500911 \
              --region us-central1 \
              --format='value(status.url)')"
          fi
          test -n "${base_url}"
          echo "base_url=${base_url}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate for staging served identity
        id: served_identity_auth
        if: >-
          github.ref_name != 'main' &&
          steps.served_identity_target.outcome == 'success'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/694608247534/locations/global/workloadIdentityPools/github-actions/providers/bicameral-cloud
          service_account: bicameral-cloud-builder@bicameral-cloud-500911.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.served_identity_target.outputs.base_url }}

      - name: Verify exact served release identity or restore prior revision
        if: always() && steps.deploy_release.outcome != 'skipped'
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.previous_revision }}
          DEPLOY_OUTCOME: ${{ steps.deploy_release.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure_release.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          SERVED_IDENTITY_TARGET_OUTCOME: ${{ steps.served_identity_target.outcome }}
          SERVED_IDENTITY_AUTH_OUTCOME: ${{ steps.served_identity_auth.outcome }}
          SERVED_IDENTITY_BASE_URL: ${{ steps.served_identity_target.outputs.base_url }}
          STAGING_ID_TOKEN: ${{ steps.served_identity_auth.outputs.id_token }}
        run: |
          set -u
          if [ "${DEPLOY_OUTCOME}" != "success" ] \
            || [ "${CONFIGURE_OUTCOME}" != "success" ] \
            || [ "${PROMOTE_OUTCOME}" != "success" ] \
            || [ "${SERVED_IDENTITY_TARGET_OUTCOME}" != "success" ] \
            || { [ "$GITHUB_REF_NAME" != "main" ] && [ "${SERVED_IDENTITY_AUTH_OUTCOME}" != "success" ]; }; then
            echo "::error::Deployment, runtime configuration, or served-identity authentication failed; restoring ${PREVIOUS_REVISION}." >&2
            gcloud run services update-traffic "${{ steps.target.outputs.service }}" \
              --project bicameral-cloud-500911 \
              --region us-central1 \
              --to-revisions "${PREVIOUS_REVISION}=100" \
              --quiet
            exit 1
          fi
          base_url="${SERVED_IDENTITY_BASE_URL}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            auth_args=()
          else
            auth_args=(--header "Authorization: Bearer ${STAGING_ID_TOKEN}")
          fi

          verified=0
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error "${auth_args[@]}" \
                "${base_url}/app/release-identity.json" \
                --output release-cloud/observed-served-identity.json \
              && python3 _release/factory/scripts/release_manifest.py \
                release-cloud/release-manifest.json \
                --served-identity release-cloud/observed-served-identity.json \
              && curl --fail-with-body --silent --show-error "${auth_args[@]}" \
                "${base_url}/health" >/dev/null \
              && curl --fail-with-body --silent --show-error "${auth_args[@]}" \
                "${base_url}/app" >/dev/null \
              && curl --fail-with-body --silent --show-error "${auth_args[@]}" \
                "${base_url}/api/v1/product-join/verification-keys" \
                --output release-cloud/observed-product-join-keys.json; then
              # /health cannot observe missing signer configuration. Requiring the
              # verification-key endpoint to return 200 makes the deploy fail closed
              # and preserves the prior revision if Product Join is not actually live.
              verified=1
              break
            fi
            sleep 5
          done

          if [ "${verified}" -ne 1 ]; then
            echo "::error::Served release identity or production smoke did not match; restoring ${PREVIOUS_REVISION}." >&2
            gcloud run services update-traffic "${{ steps.target.outputs.service }}" \
              --project bicameral-cloud-500911 \
              --region us-central1 \
              --to-revisions "${PREVIOUS_REVISION}=100" \
              --quiet
            exit 1
          fi

      - name: Retain deployed release-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-release-manifest-evidence-${{ github.sha }}
          path: release-cloud/
          if-no-files-found: error
          retention-days: 90
