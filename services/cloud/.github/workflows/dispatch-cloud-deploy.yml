name: Dispatch governed Cloud deploy

# Bridge ordinary merges on `main` into the existing governed Cloud Run deploy.
# Deployment authority remains in deploy-cloud-run.yml, which retains release,
# migration, rollback, runtime-configuration, and served-identity gates.
#
# The Bot SHA below is the v0.1.35 release pin (Alpha onboarding remediation).
# It includes the prerequisite-aware/local-accountability journey composition:
# daemon-authored local status, trusted browser mirror, explicit Device Connected
# handoff, and focused optional Google Drive final onboarding step.
# Updating the Bot release requires changing this pin through normal review before
# a new Cloud/Bot tuple can be deployed.
on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch governed deploy
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Cloud Run
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_SHA: 5ffff52856a0306a8451dc1f67acc05d8bc1cb64
        run: |
          set -euo pipefail
          gh workflow run deploy-cloud-run.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "bot_sha=${BOT_SHA}"
