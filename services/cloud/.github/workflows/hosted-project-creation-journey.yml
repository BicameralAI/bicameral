name: Hosted Dashboard Browser Gate

# Headed browser gate for the Cloud-owned pre-pair dashboard plus the vendored
# Bot post-handoff shell. Product Create/Join lifecycle acceptance remains in
# terminal-hosted-product-journey.yml, whose real daemon topology is authority
# for Product behavior. This gate is supporting UX/packaging evidence only.
#
# Budget policy: run only for PRs that can change runtime/browser behavior or
# this evidence harness. dev is PR-protected by org rules, so a post-merge push
# rerun would duplicate the already-tested PR merge result.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/bicameral_cloud/**"
      - "tests/journey/**"
      - "scripts/vendor_dashboard.sh"
      - "pyproject.toml"
      - ".github/workflows/hosted-project-creation-journey.yml"

concurrency:
  group: hosted-dashboard-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-project-creation-journey:
    name: hosted-project-creation-journey
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (app + journey harness)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,journey]'

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run hosted dashboard browser smoke and APC1 onboarding evidence
        run: >-
          pytest -q -m journey
          tests/journey/test_vendored_dashboard_smoke.py
          tests/journey/test_apc1_local_network_permission.py
          tests/journey/test_apc1_setup_polling.py
          tests/journey/test_apc1_pairing_behavior.py

      - name: Retain browser evidence (desktop, narrow, trace or failure screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-project-creation-journey-evidence
          path: test-artifacts/hosted_project_creation/
          if-no-files-found: warn
          retention-days: 14
