name: Hosted Security Hardening

on:
  pull_request:
    paths:
      - "src/bicameral_cloud/app.py"
      - "src/bicameral_cloud/config.py"
      - "src/bicameral_cloud/security_headers.py"
      - "src/bicameral_cloud/routes/security.py"
      - "src/bicameral_cloud/routes/provider_app_config.py"
      - "scripts/google_provider_auth_evidence.py"
      - "tests/test_security_hardening.py"
      - "tests/test_provider_app_config.py"
      - "tests/test_google_provider_auth_evidence.py"
      - "docs/security/hosted-http-response-policy.md"
      - ".github/workflows/hosted-security-hardening.yml"
  push:
    branches: [main]
    paths:
      - "src/bicameral_cloud/app.py"
      - "src/bicameral_cloud/config.py"
      - "src/bicameral_cloud/security_headers.py"
      - "src/bicameral_cloud/routes/security.py"
      - "src/bicameral_cloud/routes/provider_app_config.py"
      - "scripts/google_provider_auth_evidence.py"
      - "tests/test_security_hardening.py"
      - "tests/test_provider_app_config.py"
      - "tests/test_google_provider_auth_evidence.py"
      - "docs/security/hosted-http-response-policy.md"
      - ".github/workflows/hosted-security-hardening.yml"

permissions:
  contents: read

jobs:
  hosted-security-hardening:
    name: hosted-security-hardening
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused security boundary tests
        run: >-
          python -m pytest -q
          tests/test_security_hardening.py
          tests/test_provider_app_config.py
          tests/test_google_provider_auth_evidence.py

      - name: Run lint
        run: >-
          python -m ruff check
          src/bicameral_cloud
          scripts/google_provider_auth_evidence.py
          tests/test_security_hardening.py
          tests/test_provider_app_config.py
          tests/test_google_provider_auth_evidence.py

      - name: Run type checking
        run: |
          python -m mypy src/bicameral_cloud
          python -m mypy scripts/google_provider_auth_evidence.py
