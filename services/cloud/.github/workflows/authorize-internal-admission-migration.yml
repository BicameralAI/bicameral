name: Apply authorized internal admission migration

# One exact separately-authorized production backfill for #343.
# The ordinary deployment lane deliberately refuses non-automatic migrations.
# This workflow records and applies the human-authorized version before the
# normal main-push deploy reaches its migration gate. It does not deploy Cloud
# Run and it cannot select any other migration version.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/authorize-internal-admission-migration.yml

permissions:
  contents: read

concurrency:
  group: authorized-supabase-migration-production
  cancel-in-progress: false

jobs:
  apply:
    name: apply 202610020001
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact authorized Cloud revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js for pinned Supabase CLI
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2

      - name: Apply separately authorized admission backfill
        id: migrate
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${MIGRATION_DATABASE_URL}"
          echo "::add-mask::${MIGRATION_DATABASE_URL}"
          export MIGRATION_DATABASE_URL
          python3 scripts/authorized_migration_delivery.py \
            --migrations-dir supabase/migrations \
            --metadata-dir supabase/migration-metadata \
            --version 202610020001 \
            --environment production \
            --database-url-env MIGRATION_DATABASE_URL \
            --cloud-commit "${GITHUB_SHA}" \
            --authorization-reference "https://github.com/BicameralAI/bicameral-cloud/issues/343" \
            --output authorized-migration-202610020001-receipt.json

      - name: Upload authorization execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: authorized-migration-202610020001-${{ github.sha }}
          path: authorized-migration-202610020001-receipt.json
          if-no-files-found: error
          retention-days: 90
