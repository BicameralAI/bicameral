name: Governance Boundary

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  governance-boundary:
    name: governance-boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate governance boundary
        run: python3 scripts/validate_governance_boundary.py
