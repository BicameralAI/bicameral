# Mirrors apps/bot/.github/workflows/durable-evidence-acceptance.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: Durable Evidence Acceptance'
permissions:
  contents: read
jobs:
  d3a-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: stable
        components: rustfmt,clippy
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      with:
        workspaces: apps/bot -> target
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check affected crates
      run: |
        set -o pipefail
        mkdir -p test-artifacts/durable-evidence-acceptance
        {
          cargo check -p bicameral-api
          cargo check -p bicameral-gateway
          cargo check -p bicameral-runtime
        } 2>&1 | tee test-artifacts/durable-evidence-acceptance/cargo-check.log
    - name: Run evidence repository unit tests
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway evidence_repository -- --nocapture \
          2>&1 | tee test-artifacts/durable-evidence-acceptance/repository-tests.log
    - name: Run durable acceptance journey tests
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway --test durable_evidence_acceptance -- --nocapture \
          2>&1 | tee test-artifacts/durable-evidence-acceptance/journey-tests.log
    - name: Clippy affected production libraries
      run: |
        set -o pipefail
        cargo clippy -p bicameral-api -p bicameral-gateway -p bicameral-runtime --lib -- -D warnings \
          2>&1 | tee test-artifacts/durable-evidence-acceptance/clippy.log
    - name: Retain D3a diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: durable-evidence-acceptance-diagnostics
        path: apps/bot/test-artifacts/durable-evidence-acceptance
        if-no-files-found: ignore
        retention-days: 14
'on':
  workflow_dispatch: null
defaults:
  run:
    working-directory: apps/bot
