# Mirrors apps/bot/.github/workflows/candidate-disposition-contract.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: Candidate Disposition Contract'
permissions:
  contents: read
jobs:
  candidate-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: stable
        components: rustfmt,clippy
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      with:
        workspaces: apps/bot -> target
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check affected crates
      run: |
        set -o pipefail
        mkdir -p test-artifacts/candidate-disposition
        {
          cargo check -p bicameral-api --locked
          cargo check -p bicameral-gateway --locked
          cargo check -p bicameral-runtime --locked
        } 2>&1 | tee test-artifacts/candidate-disposition/check.log
    - name: Run candidate disposition tests
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway --test candidate_disposition_working_state --locked -- --nocapture \
          2>&1 | tee test-artifacts/candidate-disposition/tests.log
    - name: Check authorization conformance
      run: |
        set -o pipefail
        cargo test -p bicameral-runtime --test action_authorization_conformance --locked -- --nocapture \
          2>&1 | tee test-artifacts/candidate-disposition/authorization.log
    - name: Check committed schemas
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway --test schema_gen --locked -- --nocapture \
          2>&1 | tee test-artifacts/candidate-disposition/schema.log
    - name: Clippy affected production libraries
      run: |
        set -o pipefail
        cargo clippy -p bicameral-api -p bicameral-gateway -p bicameral-runtime --lib --locked -- -D warnings \
          2>&1 | tee test-artifacts/candidate-disposition/clippy.log
    - name: Retain diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-disposition-diagnostics
        path: apps/bot/test-artifacts/candidate-disposition
        if-no-files-found: ignore
        retention-days: 14
'on':
  workflow_dispatch: null
defaults:
  run:
    working-directory: apps/bot
