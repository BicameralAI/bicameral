# Mirrors apps/bot/.github/workflows/governance-boundary.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: Governance Boundary'
jobs:
  governance-boundary:
    name: governance-boundary
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
    - name: Validate governance boundary
      run: python3 scripts/validate_governance_boundary.py
'on':
  pull_request:
    paths:
    - apps/bot/**
    - .github/workflows/bot-governance-boundary.yml
  push:
    branches:
    - main
    paths:
    - apps/bot/**
    - .github/workflows/bot-governance-boundary.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/bot
