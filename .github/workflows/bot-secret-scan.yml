# Mirrors apps/bot/.github/workflows/secret-scan.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: Secret Scan'
jobs:
  secret-scan:
    name: repository-secret-scan
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: Run local secret scanner
      run: python3 scripts/secret_scan.py
'on':
  pull_request:
    paths:
    - apps/bot/**
    - .github/workflows/bot-secret-scan.yml
  push:
    branches:
    - main
    paths:
    - apps/bot/**
    - .github/workflows/bot-secret-scan.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/bot
