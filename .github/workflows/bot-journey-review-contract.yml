# Mirrors apps/bot/.github/workflows/journey-review-contract.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: Journey Review Contract'
permissions:
  contents: read
jobs:
  journey-review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
      with:
        workspaces: apps/bot -> target
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Compile affected crates
      run: |
        set -o pipefail
        mkdir -p test-artifacts/journey-review
        cargo check -p bicameral-api -p bicameral-gateway -p bicameral-runtime --locked \
          2>&1 | tee test-artifacts/journey-review/check.log
    - name: Run journey review unit contract
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway journey_review --lib --locked -- --nocapture \
          2>&1 | tee test-artifacts/journey-review/unit.log
    - name: Run journey review endpoint journey
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway --test journey_review_read_model --locked -- --nocapture \
          2>&1 | tee test-artifacts/journey-review/endpoint.log
    - name: Lint affected production libraries
      run: |
        set -o pipefail
        cargo clippy -p bicameral-api -p bicameral-gateway -p bicameral-runtime --lib --locked -- -D warnings \
          2>&1 | tee test-artifacts/journey-review/clippy.log
    - name: Retain diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: journey-review-diagnostics
        path: |-
          apps/bot/test-artifacts/journey-review
          apps/bot/crates/bicameral-gateway/src/journey_review.rs
        if-no-files-found: ignore
        retention-days: 14
'on':
  workflow_dispatch: null
defaults:
  run:
    working-directory: apps/bot
