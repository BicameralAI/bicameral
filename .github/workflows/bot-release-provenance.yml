# Mirrors apps/bot/.github/workflows/release-provenance.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: Release provenance'
permissions:
  contents: read
jobs:
  bot-release-descriptor:
    name: bot-release-descriptor
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: stable
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/bot/dashboard/package-lock.json
    - name: Build exact release artifacts
      run: |
        cargo build --release --locked --bin bicameral
        npm ci --prefix dashboard
        npm run build --prefix dashboard
    - name: Emit and verify immutable descriptor
      run: |
        python3 -m unittest scripts.tests.test_emit_release_descriptor
        python3 scripts/emit_release_descriptor.py --verify-hosted-bundle
        python3 scripts/emit_release_descriptor.py \
          --verify release-dashboard/bot-release-descriptor.json \
          --verify-hosted-bundle
    - name: Retain release descriptor
      uses: actions/upload-artifact@v4
      with:
        name: bot-release-descriptor-${{ github.sha }}
        path: apps/bot/release-dashboard/bot-release-descriptor.json
        if-no-files-found: error
        retention-days: 90
'on':
  push:
    branches:
    - main
    paths:
    - apps/bot/**
    - .github/workflows/bot-release-provenance.yml
  workflow_dispatch: null
defaults:
  run:
    working-directory: apps/bot
