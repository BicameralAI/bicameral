# Mirrors services/cloud/.github/workflows/governance-boundary.yml at the repository root. GitHub only runs
# root workflows; run steps execute in services/cloud/ so the component's commands are unchanged.
name: 'cloud: Governance Boundary'
jobs:
  governance-boundary:
    name: governance-boundary
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
    - name: Validate governance boundary
      run: python3 scripts/validate_governance_boundary.py
'on':
  pull_request:
    paths:
    - services/cloud/**
    - .github/workflows/cloud-governance-boundary.yml
  push:
    branches:
    - main
    paths:
    - services/cloud/**
    - .github/workflows/cloud-governance-boundary.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: services/cloud
