# Mirrors packages/integrations/.github/workflows/ci.yml at the repository root. GitHub only runs
# root workflows; run steps execute in packages/integrations/ so the component's commands are unchanged.
name: 'integrations: CI'
permissions:
  contents: read
jobs:
  test:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Install tools
      run: python -m pip install --upgrade pip ruff==0.15.5 mypy pytest jsonschema==4.25.1
    - name: Ruff
      run: ruff check adapter connectors runtime mods
    - name: Mypy
      run: |
        set -o pipefail
        mypy --show-error-codes adapter connectors runtime mods 2>&1 | tee /tmp/mypy.log
    - name: Upload mypy diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mypy-diagnostics
        path: /tmp/mypy.log
        if-no-files-found: ignore
    - name: Pytest
      run: |
        set -o pipefail
        pytest adapter/core/tests connectors runtime mods scripts/tests tests/redteam tests/redaction_evaluation -q 2>&1 | tee /tmp/pytest.log
    - name: Upload pytest diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pytest-diagnostics
        path: /tmp/pytest.log
        if-no-files-found: ignore
    - name: Connector config descriptors (validate + index freshness)
      run: python scripts/validate_connector_config.py
    - name: Mod descriptors (validate + manifest-consistency + index freshness)
      run: python scripts/validate_mod_config.py
    - name: Ingest schema pin + conformance gate
      run: python scripts/validate_ingest_schema_pin.py
    - name: Alpha ingest manifest (closed schema + honesty semantics)
      run: python scripts/validate_alpha_ingest_manifest.py
    - name: Information-cycle evidence bundle (record chain + lineage + provenance)
      # Migration-aware entry point: the monorepo carries no Integrations history, so
      # provenance is checked against migration/ evidence (scripts/migration_provenance.py).
      run: python scripts/migration_provenance.py validate ingest/evidence/local_directory-passive_import/bundle.json
    - name: Redaction evaluation corpus and annotation gate
      run: python scripts/validate_redaction_evaluation_contract.py
    - name: Redaction evaluation review and decision gate
      run: python scripts/validate_redaction_evaluation_governance.py
  exact-head-receipt:
    name: information-cycle exact-head receipt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Emit exact-head validation receipt (fail-closed head assertion)
      run: |
        set -euo pipefail
        EXPECTED="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        # Regression guard: a synthetic merge commit can never masquerade as
        # exact-head evidence.
        test "$(git rev-parse HEAD)" = "${EXPECTED}"
        python scripts/migration_provenance.py validate             ingest/evidence/local_directory-passive_import/bundle.json             --emit-head-receipt /tmp/exact-head-validation-receipt.json             --expected-head "${EXPECTED}"
    - name: Upload exact-head validation receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: information-cycle-exact-head-receipt
        path: /tmp/exact-head-validation-receipt.json
        if-no-files-found: error
'on':
  workflow_dispatch: null
  pull_request:
    paths:
    - packages/integrations/**
    - .github/workflows/integrations-ci.yml
  push:
    branches:
    - main
    paths:
    - packages/integrations/**
    - .github/workflows/integrations-ci.yml
defaults:
  run:
    working-directory: packages/integrations
