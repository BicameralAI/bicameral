# Mirrors services/cloud/.github/workflows/secret-scan.yml at the repository root. GitHub only runs
# root workflows; run steps execute in services/cloud/ so the component's commands are unchanged.
name: 'cloud: Secret Scan'
jobs:
  secret-scan:
    name: repository-secret-scan
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Run local secret scanner
      run: python3 scripts/secret_scan.py
'on':
  pull_request:
    paths:
    - services/cloud/**
    - .github/workflows/cloud-secret-scan.yml
  push:
    branches:
    - main
    paths:
    - services/cloud/**
    - .github/workflows/cloud-secret-scan.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: services/cloud
