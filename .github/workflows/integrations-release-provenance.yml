# Mirrors packages/integrations/.github/workflows/release-provenance.yml at the repository root. GitHub only runs
# root workflows; run steps execute in packages/integrations/ so the component's commands are unchanged.
name: 'integrations: Release provenance'
permissions:
  contents: read
jobs:
  descriptor:
    name: integrations-release-descriptor
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Emit and verify descriptor
      run: |
        python scripts/tests/test_emit_release_descriptor.py
        python scripts/emit_release_descriptor.py
        python scripts/emit_release_descriptor.py --verify release-artifacts/integrations-release-descriptor.json
    - uses: actions/upload-artifact@v4
      with:
        name: integrations-release-descriptor-${{ github.sha }}
        path: packages/integrations/release-artifacts/integrations-release-descriptor.json
        if-no-files-found: error
        retention-days: 90
'on':
  push:
    branches:
    - main
    paths:
    - packages/integrations/**
    - .github/workflows/integrations-release-provenance.yml
defaults:
  run:
    working-directory: packages/integrations
