name: governance

on:
  pull_request_target:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
# negative test ${{ secrets.X }}

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run governance checks
        run: python3 tools/governance/check.py
