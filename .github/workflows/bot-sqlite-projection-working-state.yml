# Mirrors apps/bot/.github/workflows/sqlite-projection-working-state.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: SQLite Projection Working State'
permissions:
  contents: read
jobs:
  d3b-storage-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: stable
        components: rustfmt,clippy
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      with:
        workspaces: apps/bot -> target
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check gateway with bundled SQLite
      run: |
        set -o pipefail
        mkdir -p test-artifacts/sqlite-projection-working-state
        cargo check -p bicameral-gateway \
          2>&1 | tee test-artifacts/sqlite-projection-working-state/cargo-check.log
    - name: Run working-state repository tests
      run: |
        set -o pipefail
        cargo test -p bicameral-gateway projection_work_repository -- --nocapture \
          2>&1 | tee test-artifacts/sqlite-projection-working-state/repository-tests.log
    - name: Clippy gateway production library
      run: |
        set -o pipefail
        cargo clippy -p bicameral-gateway --lib -- -D warnings \
          2>&1 | tee test-artifacts/sqlite-projection-working-state/clippy.log
    - name: Retain D3b diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sqlite-projection-working-state-diagnostics
        path: apps/bot/test-artifacts/sqlite-projection-working-state
        if-no-files-found: ignore
        retention-days: 14
'on':
  workflow_dispatch: null
defaults:
  run:
    working-directory: apps/bot
