# Mirrors packages/mcp/.github/workflows/python-floor-smoke.yml at the repository root. GitHub only runs
# root workflows; run steps execute in packages/mcp/ so the component's commands are unchanged.
name: 'mcp: Python Floor Smoke Test'
jobs:
  install-and-import:
    name: Install + import against declared Python floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: Set up Python 3.11 (declared floor)
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install locked dependencies
      run: python -m pip install --require-hashes -r requirements-ci.lock
    - name: Install package without resolving dependencies
      run: |
        python -m pip install --no-build-isolation --no-deps .
    - name: Import smoke test (`bicameral-mcp --version`)
      run: |
        cd /tmp
        bicameral-mcp --version
'on':
  pull_request:
    branches:
    - main
    - dev
    paths:
    - packages/mcp/**
    - .github/workflows/mcp-python-floor-smoke.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/mcp
