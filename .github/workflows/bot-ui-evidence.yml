# Mirrors apps/bot/.github/workflows/ui-evidence.yml at the repository root. GitHub only runs
# root workflows; run steps execute in apps/bot/ so the component's commands are unchanged.
name: 'bot: UI Evidence'
permissions:
  contents: read
concurrency:
  group: ui-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  headed-ui-evidence:
    name: headed-ui-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Check out exact evidence head
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Resolve evidence identity
      id: identity
      run: |
        SHA="${{ github.event.pull_request.head.sha || github.sha }}"
        REF="${{ github.event.pull_request.head.ref || github.ref_name }}"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
        echo "artifact=ui-evidence-${SHA:0:12}" >> "$GITHUB_OUTPUT"
    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/bot/dashboard/package-lock.json
    - name: Install dashboard dependencies
      working-directory: apps/bot/dashboard
      run: npm ci
    - name: Install Chromium and system dependencies
      working-directory: apps/bot/dashboard
      run: npx playwright install --with-deps chromium
    - name: Capture headed UI evidence
      working-directory: apps/bot/dashboard
      env:
        UI_EVIDENCE_HEADED: '1'
        UI_EVIDENCE_SHA: ${{ steps.identity.outputs.sha }}
        UI_EVIDENCE_REF: ${{ steps.identity.outputs.ref }}
        UI_EVIDENCE_ARTIFACT: ${{ steps.identity.outputs.artifact }}
      run: xvfb-run -a npm run evidence:ui
    - name: Publish evidence artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.identity.outputs.artifact }}
        path: apps/bot/dashboard/evidence/ui
        if-no-files-found: error
        retention-days: 14
'on':
  pull_request:
    paths:
    - apps/bot/dashboard/**
    - apps/bot/.github/workflows/ui-evidence.yml
    - .github/workflows/bot-ui-evidence.yml
  workflow_dispatch: null
defaults:
  run:
    working-directory: apps/bot
