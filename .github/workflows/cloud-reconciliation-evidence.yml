# Mirrors services/cloud/.github/workflows/reconciliation-evidence.yml at the repository root. GitHub only runs
# root workflows; run steps execute in services/cloud/ so the component's commands are unchanged.
name: 'cloud: Reconciliation Evidence Tooling'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: python -m pip install -e '.[dev]'
    - name: Lint
      run: python -m ruff check src/bicameral_cloud/evidence scripts/reconciliation_evidence.py tests/evidence
    - name: Type-check
      run: python -m mypy src/bicameral_cloud/evidence
    - name: Unit + fixture tests (no live credentials)
      run: python -m pytest -q tests/evidence
    - name: Export/validate smoke (must be fully inconclusive, never a false pass)
      env:
        CLOUDSDK_CORE_PROJECT: ''
      run: |
        python3 scripts/reconciliation_evidence.py plan > /dev/null
        python3 scripts/reconciliation_evidence.py export \
          --environment ci --output /tmp/bundle.json
        python3 scripts/reconciliation_evidence.py validate /tmp/bundle.json
        python3 - <<'PY'
        import json
        bundle = json.load(open("/tmp/bundle.json"))
        statuses = {item["status"] for item in bundle["items"]}
        assert statuses == {"environment_inconclusive"}, statuses
        assert bundle["items"], "expected collectors to run"
        print("smoke OK:", bundle["summary"])
        PY
    - name: Assert no secrets committed (repository-wide, includes evidence tooling)
      run: python3 scripts/secret_scan.py
'on':
  pull_request:
    branches:
    - dev
    - main
    paths:
    - services/cloud/src/bicameral_cloud/evidence/**
    - services/cloud/scripts/reconciliation_evidence.py
    - services/cloud/tests/evidence/**
    - services/cloud/docs/evidence/**
    - services/cloud/supabase/migrations/**
    - services/cloud/.github/workflows/reconciliation-evidence.yml
    - .github/workflows/cloud-reconciliation-evidence.yml
  push:
    branches:
    - main
    paths:
    - services/cloud/src/bicameral_cloud/evidence/**
    - services/cloud/scripts/reconciliation_evidence.py
    - services/cloud/tests/evidence/**
    - services/cloud/docs/evidence/**
    - services/cloud/supabase/migrations/**
    - services/cloud/.github/workflows/reconciliation-evidence.yml
    - .github/workflows/cloud-reconciliation-evidence.yml
defaults:
  run:
    working-directory: services/cloud
